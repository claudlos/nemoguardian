name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Lint and tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Everything pyproject.toml claims to support.
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run verification
        run: make verify PYTHON=python

      - name: Check documentation links
        run: make link-check PYTHON=python

      - name: Scan for secret-shaped tokens
        run: make secret-scan PYTHON=python

      - name: Validate package build metadata
        run: make build-check PYTHON=python

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Slim build (no model predownload) — proves the Dockerfile stays in sync
      # with pyproject.toml without pulling GB of weights into CI.
      - name: Build image
        run: docker build --build-arg NEMOGUARDIAN_SKIP_PREDOWNLOAD=1 -t nemoguardian/self-hosted:ci .

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    # Scan the full history so a secret that slipped into an earlier commit (and
    # was later removed) is still caught — important for a public repo.
    steps:
      - name: Check out repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: true

  sast:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"

  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip-audit

      # Audit the project as installed from pyproject.toml. Fails on any known
      # vulnerability in the installed dependency tree.
      - name: Audit dependencies
        run: |
          python -m pip install -e .
          # Audit the resolved third-party dependency set, not our own editable
          # (unpublished) package — --exclude-editable drops nemoguardian so
          # --strict doesn't choke on "not found on PyPI".
          python -m pip freeze --exclude-editable > audit-requirements.txt
          pip-audit -r audit-requirements.txt --strict
